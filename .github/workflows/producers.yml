name: Scarica produttori
on:
  workflow_dispatch:
  push:
    paths:
      - tools/fetch_producers.py
      - .github/workflows/producers.yml
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/fetch_producers.py
        continue-on-error: true
      - name: Salva i dati grezzi nel ramo data-raw
        run: |
          cd out
          git init -q -b data-raw
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Dati grezzi produttori $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data-raw
