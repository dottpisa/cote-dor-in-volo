name: Scarica produttori
on:
  workflow_dispatch:
  push:
    paths:
      - tools/fetch_producers.py
      - .github/workflows/producers.yml
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/fetch_producers.py
      - uses: actions/upload-artifact@v4
        with:
          name: produttori-grezzi
          path: out/
          retention-days: 3
